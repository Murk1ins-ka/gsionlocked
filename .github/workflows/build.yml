name: App and source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;25.2.9519653"
      - run: python tools/audit_public.py
      - run: python tools/test.py
      - run: python tools/build_app.py
      - uses: actions/upload-artifact@v4
        with:
          name: gsionlocked-unsigned
          path: dist/gsionlocked-unsigned.apk
      - run: python tools/package_source.py
      - uses: actions/upload-artifact@v4
        with:
          name: gsionlocked-source
          path: dist/gsionlocked-source.zip
